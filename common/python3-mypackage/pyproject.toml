[project]
name = "mypackage"
version = "0.0.1"
description = ""
authors = [
  { name = "Kojiro ONO", email = "ono.kojiro@gmail.com" }
]

readme = "README.md"

dependencies = [
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2",
]

[tool.setuptools.packages]
find = { where = [ "src"] }

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
mycli = "mypackage.mymodule.myfunc:main"

